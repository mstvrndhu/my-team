<!-- 交接：已完成 v3 三語切換版（繁體中文／English／Bahasa Indonesia），支援即時語系切換、完整欄位翻譯與狀態保留，且保持離線單檔與無障礙規格；可直接以瀏覽器離線開啟使用。 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI 計算器</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --primary-color: #1976d2;
      --primary-hover: #1565c0;
      --border-color: #dcdfe6;
      --error-color: #d32f2f;
      --status-underweight: #0288d1;
      --status-normal: #2e7d32;
      --status-overweight: #ed6c02;
      --status-obese: #d32f2f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft JhengHei", "微軟正黑體", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
      padding: 32px 28px;
    }

    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 14px;
    }

    .lang-btn {
      flex: none;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #f8fafc;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      background-color: #edf2f7;
      color: var(--text-main);
    }

    .lang-btn.active {
      background-color: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 24px;
      color: #1a1a1a;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #444444;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }

    input.input-error {
      border-color: var(--error-color);
      background-color: #fff8f8;
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.85rem;
      margin-top: 5px;
      min-height: 1.2em;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    button.action-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.action-btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #f0f0f0;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #e4e4e4;
    }

    .result-card {
      margin-top: 26px;
      padding: 20px;
      background-color: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      text-align: center;
      display: none;
    }

    .result-card.show {
      display: block;
    }

    .bmi-value-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .bmi-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .status-underweight { background-color: var(--status-underweight); }
    .status-normal { background-color: var(--status-normal); }
    .status-overweight { background-color: var(--status-overweight); }
    .status-obese { background-color: var(--status-obese); }

    .result-tip {
      font-size: 0.9rem;
      color: #4b5563;
      line-height: 1.5;
    }

    .reference-table {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid #edf2f7;
      padding-top: 16px;
    }

    .reference-table table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    .reference-table th,
    .reference-table td {
      padding: 4px 8px;
      text-align: left;
    }

    .reference-table th {
      font-weight: 600;
      color: #4a5568;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-switcher" role="group" aria-label="切換語言 / Select Language / Pilih Bahasa">
      <button type="button" class="lang-btn active" data-lang="zh-TW" aria-pressed="true">繁中</button>
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" class="lang-btn" data-lang="id" aria-pressed="false">ID</button>
    </div>

    <h1 id="mainTitle">BMI 計算器</h1>

    <div class="form-group">
      <label for="heightInput" id="heightLabel">身高（公分 / cm）</label>
      <input type="number" id="heightInput" placeholder="例如：170" step="any" min="50" max="250" aria-describedby="heightError">
      <div id="heightError" class="error-msg" role="alert"></div>
    </div>

    <div class="form-group">
      <label for="weightInput" id="weightLabel">體重（公斤 / kg）</label>
      <input type="number" id="weightInput" placeholder="例如：65" step="any" min="10" max="300" aria-describedby="weightError">
      <div id="weightError" class="error-msg" role="alert"></div>
    </div>

    <div class="btn-group">
      <button type="button" class="action-btn btn-secondary" id="resetBtn">重設</button>
      <button type="button" class="action-btn btn-primary" id="calcBtn">計算</button>
    </div>

    <div id="resultCard" class="result-card" aria-live="polite">
      <div class="bmi-value-label" id="resultHeading">計算結果</div>
      <div class="bmi-number" id="bmiValue">--</div>
      <div>
        <span id="statusBadge" class="status-badge">--</span>
      </div>
      <p id="resultTip" class="result-tip"></p>
    </div>

    <div class="reference-table">
      <div><strong id="refTitle">衛福部 BMI 體位標準參考：</strong></div>
      <table>
        <tbody>
          <tr><td id="refUnderweight">過輕</td><td>BMI &lt; 18.5</td></tr>
          <tr><td id="refNormal">正常</td><td>18.5 ≤ BMI &lt; 24</td></tr>
          <tr><td id="refOverweight">過重（微胖）</td><td>24 ≤ BMI &lt; 27</td></tr>
          <tr><td id="refObese">肥胖</td><td>BMI ≥ 27</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const i18n = {
      'zh-TW': {
        htmlLang: 'zh-TW',
        docTitle: 'BMI 計算器',
        mainTitle: 'BMI 計算器',
        heightLabel: '身高（公分 / cm）',
        heightPlaceholder: '例如：170',
        weightLabel: '體重（公斤 / kg）',
        weightPlaceholder: '例如：65',
        calcBtn: '計算',
        resetBtn: '重設',
        resultHeading: '計算結果',
        refTitle: '衛福部 BMI 體位標準參考：',
        catUnderweight: '過輕',
        catNormal: '正常',
        catOverweight: '過重（微胖）',
        catObese: '肥胖',
        tipUnderweight: '體重過輕，建議均衡飲食並適度增加營養與肌力訓練。',
        tipNormal: '體位標準，請繼續保持良好的飲食與運動習慣！',
        tipOverweight: '體重稍重，建議注意飲食熱量攝取並多加規律運動。',
        tipObese: '體位已達肥胖標準，建議諮詢專業醫師或營養師調整生活作息。',
        errEmptyHeight: '請輸入數字（例如：170）',
        errZeroHeight: '數值必須大於 0',
        errSmallHeight: '數值過小，請確認單位是否為公分（需介於 50 至 250 公分）',
        errLargeHeight: '數值太大，請確認單位是否為公分（需介於 50 至 250 公分）',
        errEmptyWeight: '請輸入數字（例如：65）',
        errZeroWeight: '數值必須大於 0',
        errSmallWeight: '數值過小，請確認單位是否為公斤（需介於 10 至 300 公斤）',
        errLargeWeight: '數值太大，請確認單位是否為公斤（需介於 10 至 300 公斤）'
      },
      'en': {
        htmlLang: 'en',
        docTitle: 'BMI Calculator',
        mainTitle: 'BMI Calculator',
        heightLabel: 'Height (cm)',
        heightPlaceholder: 'e.g. 170',
        weightLabel: 'Weight (kg)',
        weightPlaceholder: 'e.g. 65',
        calcBtn: 'Calculate',
        resetBtn: 'Reset',
        resultHeading: 'Result',
        refTitle: 'BMI categories (Ministry of Health standard):',
        catUnderweight: 'Underweight',
        catNormal: 'Normal',
        catOverweight: 'Overweight',
        catObese: 'Obese',
        tipUnderweight: 'Underweight. Recommended to balance diet and increase nutrition and strength training.',
        tipNormal: 'Normal weight. Keep up the good diet and regular exercise habits!',
        tipOverweight: 'Overweight. It is recommended to monitor caloric intake and exercise regularly.',
        tipObese: 'Obesity. Recommended to consult a medical professional or nutritionist for weight management.',
        errEmptyHeight: 'Please enter a number (e.g. 170)',
        errZeroHeight: 'Value must be greater than 0',
        errSmallHeight: 'Value too small, check that the unit is cm (must be between 50 and 250 cm)',
        errLargeHeight: 'Value too large, check that the unit is cm (must be between 50 and 250 cm)',
        errEmptyWeight: 'Please enter a number (e.g. 65)',
        errZeroWeight: 'Value must be greater than 0',
        errSmallWeight: 'Value too small, check that the unit is kg (must be between 10 and 300 kg)',
        errLargeWeight: 'Value too large, check that the unit is kg (must be between 10 and 300 kg)'
      },
      'id': {
        htmlLang: 'id',
        docTitle: 'Kalkulator BMI',
        mainTitle: 'Kalkulator BMI',
        heightLabel: 'Tinggi badan (cm)',
        heightPlaceholder: 'contoh: 170',
        weightLabel: 'Berat badan (kg)',
        weightPlaceholder: 'contoh: 65',
        calcBtn: 'Hitung',
        resetBtn: 'Ulangi',
        resultHeading: 'Hasil perhitungan',
        refTitle: 'Kategori BMI (standar Kemenkes):',
        catUnderweight: 'Kurang berat badan',
        catNormal: 'Normal',
        catOverweight: 'Kelebihan berat badan',
        catObese: 'Obesitas',
        tipUnderweight: 'Kurang berat badan. Disarankan untuk menjaga pola makan seimbang serta menambah asupan nutrisi dan latihan kekuatan.',
        tipNormal: 'Berat badan ideal. Pertahankan pola makan sehat dan kebiasaan olahraga teratur!',
        tipOverweight: 'Kelebihan berat badan. Disarankan memperhatikan asupan kalori dan berolahraga secara teratur.',
        tipObese: 'Obesitas. Disarankan untuk berkonsultasi dengan dokter atau ahli gizi untuk pengelolaan berat badan.',
        errEmptyHeight: 'Masukkan angka (contoh: 170)',
        errZeroHeight: 'Nilai harus lebih besar dari 0',
        errSmallHeight: 'Nilai terlalu kecil, pastikan satuan dalam cm (harus antara 50 dan 250 cm)',
        errLargeHeight: 'Nilai terlalu besar, pastikan satuan dalam cm (harus antara 50 dan 250 cm)',
        errEmptyWeight: 'Masukkan angka (contoh: 65)',
        errZeroWeight: 'Nilai harus lebih besar dari 0',
        errSmallWeight: 'Nilai terlalu kecil, pastikan satuan dalam kg (harus antara 10 dan 300 kg)',
        errLargeWeight: 'Nilai terlalu besar, pastikan satuan dalam kg (harus antara 10 dan 300 kg)'
      }
    };

    let currentLang = 'zh-TW';
    let currentCategoryKey = null;
    let currentHeightErrorType = null;
    let currentWeightErrorType = null;

    const mainTitle = document.getElementById('mainTitle');
    const heightLabel = document.getElementById('heightLabel');
    const heightInput = document.getElementById('heightInput');
    const heightError = document.getElementById('heightError');

    const weightLabel = document.getElementById('weightLabel');
    const weightInput = document.getElementById('weightInput');
    const weightError = document.getElementById('weightError');

    const calcBtn = document.getElementById('calcBtn');
    const resetBtn = document.getElementById('resetBtn');

    const resultCard = document.getElementById('resultCard');
    const resultHeading = document.getElementById('resultHeading');
    const bmiValue = document.getElementById('bmiValue');
    const statusBadge = document.getElementById('statusBadge');
    const resultTip = document.getElementById('resultTip');

    const refTitle = document.getElementById('refTitle');
    const refUnderweight = document.getElementById('refUnderweight');
    const refNormal = document.getElementById('refNormal');
    const refOverweight = document.getElementById('refOverweight');
    const refObese = document.getElementById('refObese');

    const langButtons = document.querySelectorAll('.lang-btn');

    function setLang(lang) {
      if (!i18n[lang]) return;
      currentLang = lang;
      const t = i18n[lang];

      document.documentElement.lang = t.htmlLang;
      document.title = t.docTitle;
      mainTitle.textContent = t.mainTitle;

      heightLabel.textContent = t.heightLabel;
      heightInput.placeholder = t.heightPlaceholder;

      weightLabel.textContent = t.weightLabel;
      weightInput.placeholder = t.weightPlaceholder;

      calcBtn.textContent = t.calcBtn;
      resetBtn.textContent = t.resetBtn;
      resultHeading.textContent = t.resultHeading;

      refTitle.textContent = t.refTitle;
      refUnderweight.textContent = t.catUnderweight;
      refNormal.textContent = t.catNormal;
      refOverweight.textContent = t.catOverweight;
      refObese.textContent = t.catObese;

      langButtons.forEach(btn => {
        const isActive = btn.dataset.lang === lang;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });

      // 即時切換已存在的結果文字
      if (resultCard.classList.contains('show') && currentCategoryKey) {
        statusBadge.textContent = t[currentCategoryKey];
        const tipKey = 'tip' + currentCategoryKey.replace(/^cat/, '');
        resultTip.textContent = t[tipKey];
      }

      // 即時切換已存在的錯誤訊息文字
      if (currentHeightErrorType) {
        heightError.textContent = t[currentHeightErrorType];
      }
      if (currentWeightErrorType) {
        weightError.textContent = t[currentWeightErrorType];
      }
    }

    langButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        setLang(btn.dataset.lang);
      });
    });

    function clearErrors() {
      currentHeightErrorType = null;
      currentWeightErrorType = null;

      heightError.textContent = '';
      heightError.classList.remove('show');
      heightInput.classList.remove('input-error');
      heightInput.removeAttribute('aria-invalid');

      weightError.textContent = '';
      weightError.classList.remove('show');
      weightInput.classList.remove('input-error');
      weightInput.removeAttribute('aria-invalid');
    }

    function calculateBMI() {
      clearErrors();
      const t = i18n[currentLang];

      const rawHeight = heightInput.value.trim();
      const rawWeight = weightInput.value.trim();
      let hasError = false;
      let firstInvalidInput = null;

      // 檢查身高
      if (!rawHeight) {
        currentHeightErrorType = 'errEmptyHeight';
        heightError.textContent = t[currentHeightErrorType];
        heightError.classList.add('show');
        heightInput.classList.add('input-error');
        heightInput.setAttribute('aria-invalid', 'true');
        hasError = true;
        firstInvalidInput = firstInvalidInput || heightInput;
      } else {
        const height = parseFloat(rawHeight);
        if (isNaN(height)) {
          currentHeightErrorType = 'errEmptyHeight';
          heightError.textContent = t[currentHeightErrorType];
          heightError.classList.add('show');
          heightInput.classList.add('input-error');
          heightInput.setAttribute('aria-invalid', 'true');
          hasError = true;
          firstInvalidInput = firstInvalidInput || heightInput;
        } else if (height <= 0) {
          currentHeightErrorType = 'errZeroHeight';
          heightError.textContent = t[currentHeightErrorType];
          heightError.classList.add('show');
          heightInput.classList.add('input-error');
          heightInput.setAttribute('aria-invalid', 'true');
          hasError = true;
          firstInvalidInput = firstInvalidInput || heightInput;
        } else if (height < 50) {
          currentHeightErrorType = 'errSmallHeight';
          heightError.textContent = t[currentHeightErrorType];
          heightError.classList.add('show');
          heightInput.classList.add('input-error');
          heightInput.setAttribute('aria-invalid', 'true');
          hasError = true;
          firstInvalidInput = firstInvalidInput || heightInput;
        } else if (height > 250) {
          currentHeightErrorType = 'errLargeHeight';
          heightError.textContent = t[currentHeightErrorType];
          heightError.classList.add('show');
          heightInput.classList.add('input-error');
          heightInput.setAttribute('aria-invalid', 'true');
          hasError = true;
          firstInvalidInput = firstInvalidInput || heightInput;
        }
      }

      // 檢查體重
      if (!rawWeight) {
        currentWeightErrorType = 'errEmptyWeight';
        weightError.textContent = t[currentWeightErrorType];
        weightError.classList.add('show');
        weightInput.classList.add('input-error');
        weightInput.setAttribute('aria-invalid', 'true');
        hasError = true;
        firstInvalidInput = firstInvalidInput || weightInput;
      } else {
        const weight = parseFloat(rawWeight);
        if (isNaN(weight)) {
          currentWeightErrorType = 'errEmptyWeight';
          weightError.textContent = t[currentWeightErrorType];
          weightError.classList.add('show');
          weightInput.classList.add('input-error');
          weightInput.setAttribute('aria-invalid', 'true');
          hasError = true;
          firstInvalidInput = firstInvalidInput || weightInput;
        } else if (weight <= 0) {
          currentWeightErrorType = 'errZeroWeight';
          weightError.textContent = t[currentWeightErrorType];
          weightError.classList.add('show');
          weightInput.classList.add('input-error');
          weightInput.setAttribute('aria-invalid', 'true');
          hasError = true;
          firstInvalidInput = firstInvalidInput || weightInput;
        } else if (weight < 10) {
          currentWeightErrorType = 'errSmallWeight';
          weightError.textContent = t[currentWeightErrorType];
          weightError.classList.add('show');
          weightInput.classList.add('input-error');
          weightInput.setAttribute('aria-invalid', 'true');
          hasError = true;
          firstInvalidInput = firstInvalidInput || weightInput;
        } else if (weight > 300) {
          currentWeightErrorType = 'errLargeWeight';
          weightError.textContent = t[currentWeightErrorType];
          weightError.classList.add('show');
          weightInput.classList.add('input-error');
          weightInput.setAttribute('aria-invalid', 'true');
          hasError = true;
          firstInvalidInput = firstInvalidInput || weightInput;
        }
      }

      if (hasError) {
        resultCard.classList.remove('show');
        currentCategoryKey = null;
        if (firstInvalidInput) {
          firstInvalidInput.focus();
        }
        return;
      }

      const height = parseFloat(rawHeight);
      const weight = parseFloat(rawWeight);
      const heightMeters = height / 100;
      const bmi = weight / (heightMeters * heightMeters);
      const formattedBMI = bmi.toFixed(1);

      let badgeClass = '';

      if (bmi < 18.5) {
        currentCategoryKey = 'catUnderweight';
        badgeClass = 'status-underweight';
      } else if (bmi < 24) {
        currentCategoryKey = 'catNormal';
        badgeClass = 'status-normal';
      } else if (bmi < 27) {
        currentCategoryKey = 'catOverweight';
        badgeClass = 'status-overweight';
      } else {
        currentCategoryKey = 'catObese';
        badgeClass = 'status-obese';
      }

      const tipKey = 'tip' + currentCategoryKey.replace(/^cat/, '');

      bmiValue.textContent = `BMI ${formattedBMI}`;
      statusBadge.textContent = t[currentCategoryKey];
      statusBadge.className = `status-badge ${badgeClass}`;
      resultTip.textContent = t[tipKey];
      resultCard.classList.add('show');
    }

    calcBtn.addEventListener('click', calculateBMI);

    [heightInput, weightInput].forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          calculateBMI();
        }
      });
      input.addEventListener('input', () => {
        if (input.classList.contains('input-error')) {
          input.classList.remove('input-error');
          input.removeAttribute('aria-invalid');
          const errorElem = input.id === 'heightInput' ? heightError : weightError;
          errorElem.textContent = '';
          errorElem.classList.remove('show');
          if (input.id === 'heightInput') currentHeightErrorType = null;
          if (input.id === 'weightInput') currentWeightErrorType = null;
        }
      });
    });

    resetBtn.addEventListener('click', () => {
      heightInput.value = '';
      weightInput.value = '';
      clearErrors();
      currentCategoryKey = null;
      resultCard.classList.remove('show');
      heightInput.focus();
    });

    // 初始化語言 (繁體中文)
    setLang('zh-TW');
  </script>
</body>
</html>
